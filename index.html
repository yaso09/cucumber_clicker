<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salatalık Doğra - Anasayfa</title>

<style>
:root{
  --bg:#0e0e0e;
  --panel:#181818;
  --panel2:#202020;
  --border:#2c2c2c;
  --accent:#4caf50;
  --text:#eaeaea;
}
*{box-sizing:border-box;user-select:none;font-family:system-ui}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  min-height:100vh
}
header{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:12px;
  padding-top:2.6rem;
  background:var(--panel);
  border-bottom:1px solid var(--border)
}
main{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px
}
button{
  padding:12px 20px;
  margin:10px;
  font-size:1rem;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:#000;
  font-weight:600;
  cursor:pointer
}
.modal{
  position:fixed;
  inset:0;
  background:#000c;
  padding:20px;
  overflow:auto
}
.hidden{display:none}
.modal-box{
  max-width:420px;
  margin:auto;
  background:var(--panel);
  border-radius:16px;
  padding:16px
}
.card{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px
}
.card button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:#000;
  font-weight:600
}
.close{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#333;
  color:#fff;
  margin-top:10px
}
</style>
</head>

<body>

<header>
  <h1>🥒 Salatalık Doğra</h1>
</header>

<main>
  <p>Hoş geldin! Bu oyunla salatalıkları doğra, turşu yap ve pazarını büyüt!</p>
  <button onclick="startGame()">Oyunu Başlat</button>
  <button class="hidden" onclick="openApkModal()">APK İndir</button>
  <button id="openLoginModal" onclick="openLoginModal()" hidden>Oturum Aç</button>
</main>

<!-- OTURUM AÇ MODAL -->
<div id="loginModal" class="modal hidden">
  <div class="modal-box">
    <h3>Oturum Aç</h3>

    <button onclick="loginWith('oauth_google')">Google</button>
    <button onclick="loginWith('oauth_facebook')">Facebook</button>
    <button onclick="loginWith('oauth_discord')">Discord</button>

    <button class="close" onclick="closeModals()">Kapat</button>
  </div>
</div>

<!-- APK MODAL -->
<div id="apkModal" class="modal hidden">
  <div class="modal-box">
    <h3>Uygulamayı indir</h3>
    <div class="card">
      <p>Bu oyunu Android cihazına yüklemek ister misin?</p>
      <button onclick="window.location.href='./latest.apk'">APK İndir</button>
    </div>
    <button class="close" onclick="closeModals()">Kapat</button>
  </div>
</div>

<script>
const isAndroid = /Android/i.test(navigator.userAgent);

function openLoginModal(){
  document.getElementById("loginModal").classList.remove("hidden");
}

function openApkModal(){
  if(isAndroid){
    document.getElementById("apkModal").classList.remove("hidden");
  }else{
    alert("Bu cihaz için APK bulunmuyor.");
  }
}

function closeModals(){
  document.querySelectorAll(".modal")
    .forEach(m=>m.classList.add("hidden"));
}

function startGame(){
  const params = new URLSearchParams(window.location.search);
  let url = "/game.html";
  if(params.get("application")==="true"){
    url += "?application=true";
  }
  window.location.href = url;
}

async function loginWith(strategy){
  await Clerk.load();
  Clerk.openSignIn(strategy);
}

async function loadClerk(){
  await Clerk.load();
  
  if (!Clerk.isSignedIn)
    document.getElementById("openLoginModal").hidden = false;
}
</script>
</body>
</html>
