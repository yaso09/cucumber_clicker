<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salatalık Doğra - Anasayfa</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Clerk Support (Placeholder if missing in original, but keeping structure) -->
</head>

<body>

  <header>
    <h1>🥒 Salatalık Doğra</h1>
  </header>

  <main>
    <div class="landing-container">
      <h2 class="landing-title">Salatalık İmparatorluğu</h2>
      <p class="landing-desc">
        Hoş geldin! Milyonlarca salatalık doğra, fabrikalar kur, teyzelerle anlaş ve turşu imparatorluğunu yönet.
      </p>

      <div class="card-actions" style="max-width:300px; margin:auto;">
        <button onclick="startGame()" class="big-btn">Oyunu Başlat</button>

        <button id="btn-apk" class="big-btn btn-secondary hidden" onclick="openApkModal()">APK İndir</button>
        <button id="openLoginModal" class="big-btn btn-secondary" onclick="openLoginModal()" hidden>Oturum Aç</button>
      </div>
    </div>
  </main>

  <!-- Modals -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Oturum Aç</span>
        <button class="btn-close" onclick="closeModals()">×</button>
      </div>
      <div class="modal-body">
        <div class="card-actions">
          <button class="btn-secondary" onclick="loginWith('oauth_google')">Google ile Giriş</button>
          <button class="btn-secondary" onclick="loginWith('oauth_facebook')">Facebook ile Giriş</button>
          <button class="btn-secondary" onclick="loginWith('oauth_discord')">Discord ile Giriş</button>
        </div>
      </div>
    </div>
  </div>

  <div id="apkModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Uygulamayı İndir</span>
        <button class="btn-close" onclick="closeModals()">×</button>
      </div>
      <div class="modal-body">
        <p>Bu oyunu Android cihazına yüklemek ister misin?</p>
        <button class="big-btn" onclick="window.location.href='./latest.apk'">APK İndir</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js" type="module"></script>
  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);

    // UI Helpers (replicating basic logic here since we didn't import game.js)
    function $(id) { return document.getElementById(id); }

    function openLoginModal() {
      $('loginModal').classList.remove('hidden');
      setTimeout(() => $('loginModal').classList.add('active'), 10);
    }

    function openApkModal() {
      if (isAndroid) {
        $('apkModal').classList.remove('hidden');
        setTimeout(() => $('apkModal').classList.add('active'), 10);
      } else {
        alert("Bu cihaz için APK bulunmuyor.");
      }
    }

    function closeModals() {
      document.querySelectorAll(".modal-overlay").forEach(m => {
        m.classList.remove('active');
        setTimeout(() => m.classList.add('hidden'), 300);
      });
    }

    function startGame() {
      const params = new URLSearchParams(window.location.search);
      let url = "game.html";
      if (params.get("application") === "true") {
        url += "?application=true";
      }
      window.location.href = url;
    }

    // Initialize
    if (isAndroid) {
      $('btn-apk').classList.remove('hidden');
    }

    // Clerk Logic (Preserved)
    async function loginWith(strategy) {
      if (window.Clerk) {
        await Clerk.load();
        Clerk.openSignIn(strategy);
      } else {
        console.warn("Clerk not loaded");
      }
    }

    async function loadClerk() {
      if (window.Clerk) {
        await Clerk.load();
        if (!Clerk.isSignedIn) {
          $('openLoginModal').hidden = false;
        }
      }
    }

    loadClerk();

    // Modal Close Listeners
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', e => {
        if (e.target === overlay) closeModals();
      });
    });
  </script>
</body>

</html>
