<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salatalık Doğra - Anasayfa</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Clerk Support (Placeholder if missing in original, but keeping structure) -->
</head>

<body>

  <header>
    <div class="header-logo">
      <img src="assets/images/cucumber.svg" alt="Logo" class="mini-cucumber">
      <h1>Salatalık Doğra</h1>
    </div>
  </header>

  <main>
    <div class="landing-hero">
      <div class="hero-bg-blobs">
        <div class="blob"></div>
        <div class="blob"></div>
      </div>

      <div class="landing-container">
        <div class="badge">Sürüm 1.2.0</div>
        <h2 class="landing-title">Salatalık İmparatorluğu</h2>
        <p class="landing-desc">
          Milyonlarca salatalık doğra, fabrikalar kur, teyzelerle anlaş ve turşu imparatorluğunu yöneten en büyük
          turşucu ol.
        </p>

        <div class="landing-actions">
          <button onclick="startGame()" class="primary-hero-btn">
            <span class="icon">🚀</span> Oyunu Başlat
          </button>
          <button id="btn-apk" class="secondary-hero-btn hidden" onclick="openApkModal()">
            <span class="icon">🤖</span> APK İndir
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- APK Modal (Simplified) -->
  <div id="apkModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Uygulamayı İndir</span>
        <button class="btn-close" onclick="closeModals()">×</button>
      </div>
      <div class="modal-body">
        <p>Bu oyunu Android cihazına yüklemek ister misin?</p>
        <button class="primary-hero-btn" onclick="window.location.href='./latest.apk'">APK İndir</button>
      </div>
    </div>
  </div>

  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);

    function $(id) { return document.getElementById(id); }

    function openApkModal() {
      if (isAndroid) {
        const m = $('apkModal');
        m.classList.remove('hidden');
        requestAnimationFrame(() => m.classList.add('active'));
      } else {
        alert("Bu cihaz için APK bulunmuyor.");
      }
    }

    function closeModals() {
      document.querySelectorAll(".modal-overlay").forEach(m => {
        m.classList.remove('active');
        setTimeout(() => m.classList.add('hidden'), 300);
      });
    }

    function startGame() {
      const params = new URLSearchParams(window.location.search);
      let url = "game.html";
      if (params.get("application") === "true") {
        url += "?application=true";
      }
      window.location.href = url;
    }

    // Initialize
    if (isAndroid) {
      $('btn-apk').classList.remove('hidden');
    }

    // Modal Close Listeners
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', e => {
        if (e.target === overlay) closeModals();
      });
    });
  </script>
</body>

</html>
