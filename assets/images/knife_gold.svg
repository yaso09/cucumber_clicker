<svg viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff9100;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc7a00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Blade -->
  <path d="M10,20 Q10,12 50,12 L150,12 L150,28 Q150,32 10,32 Z" fill="url(#goldGrad)" stroke="#ffab00" stroke-width="0.5" filter="url(#glow)"/>
  <!-- Hilt -->
  <rect x="150" y="8" width="10" height="24" rx="2" fill="#d4af37" stroke="#8c6d00" stroke-width="1"/>
  <!-- Handle -->
  <rect x="160" y="12" width="40" height="16" rx="8" fill="#4a148c" stroke="#212121" stroke-width="1"/>
  <!-- Gem -->
  <circle cx="155" cy="20" r="3" fill="#00e676" stroke="#000" stroke-width="0.5"/>
</svg>