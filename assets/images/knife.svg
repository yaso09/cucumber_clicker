<svg width="250" height="90" viewBox="0 0 250 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metal Blade Gradient -->
    <linearGradient id="bladeGrad" x1="100" y1="20" x2="100" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFBFC"/>
      <stop offset="20%" stop-color="#E4E7E9"/>
      <stop offset="45%" stop-color="#B0BEC5"/>
      <stop offset="50%" stop-color="#78909C"/>
      <stop offset="55%" stop-color="#B0BEC5"/>
      <stop offset="80%" stop-color="#E4E7E9"/>
      <stop offset="100%" stop-color="#FAFBFC"/>
    </linearGradient>
    
    <!-- Handle Wood Gradient -->
    <linearGradient id="handleGrad" x1="0" y1="30" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1B18"/>
      <stop offset="50%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#2D1B18"/>
    </linearGradient>

    <!-- Bolster Gradient -->
    <linearGradient id="bolsterGrad" x1="85" y1="25" x2="95" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="50%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>

    <!-- Blade Reflection -->
    <linearGradient id="bladeReflect" x1="100" y1="20" x2="100" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="4" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Handle -->
  <g filter="url(#shadow)">
    <rect x="5" y="28" width="80" height="34" rx="8" fill="url(#handleGrad)" stroke="#1A0F0D" stroke-width="1"/>
    <!-- Wood grain details -->
    <path d="M15 35C40 33 60 37 75 35" stroke="#3E2723" stroke-width="0.5" opacity="0.6"/>
    <path d="M15 45C45 42 65 48 75 45" stroke="#3E2723" stroke-width="0.5" opacity="0.6"/>
    <path d="M15 55C35 53 55 57 75 55" stroke="#3E2723" stroke-width="0.5" opacity="0.6"/>
    
    <!-- Rivets (Brass/Steel look) -->
    <g>
      <circle cx="20" cy="45" r="4" fill="#CFD8DC" stroke="#90A4AE" stroke-width="0.5"/>
      <circle cx="20" cy="44" r="1.5" fill="white" opacity="0.5"/>
      
      <circle cx="45" cy="45" r="4" fill="#CFD8DC" stroke="#90A4AE" stroke-width="0.5"/>
      <circle cx="45" cy="44" r="1.5" fill="white" opacity="0.5"/>
      
      <circle cx="70" cy="45" r="4" fill="#CFD8DC" stroke="#90A4AE" stroke-width="0.5"/>
      <circle cx="70" cy="44" r="1.5" fill="white" opacity="0.5"/>
    </g>
  </g>

  <!-- Bolster -->
  <rect x="85" y="25" width="10" height="40" rx="2" fill="url(#bolsterGrad)" stroke="#78909C" stroke-width="0.5"/>

  <!-- Blade -->
  <g filter="url(#shadow)">
    <!-- Base Blade shape -->
    <path d="M95 20L230 20C245 20 250 55 210 70L95 70V20Z" fill="url(#bladeGrad)" stroke="#546E7A" stroke-width="1"/>
    <!-- Blade Edge highlight -->
    <path d="M95 70L210 70C225 65 240 45 235 30" fill="none" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <!-- Top reflection -->
    <rect x="100" y="22" width="120" height="15" fill="url(#bladeReflect)"/>
  </g>
</svg>
