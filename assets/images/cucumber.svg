<svg width="220" height="80" viewBox="0 0 220 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Cylinder Gradient (Volumetric) -->
    <linearGradient id="bodyGrad" x1="0" y1="15" x2="0" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#66BB6A"/>  <!-- Top light -->
      <stop offset="30%" stop-color="#43A047"/> <!-- Mid tone -->
      <stop offset="80%" stop-color="#1B5E20"/> <!-- Deep shadow -->
      <stop offset="100%" stop-color="#123E16"/> <!-- Ground reflection -->
    </linearGradient>
    
    <!-- Top Highlight -->
    <linearGradient id="shineGrad" x1="0" y1="15" x2="0" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- End Cap Shadows -->
    <radialGradient id="endCapGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="70%" stop-color="black" stop-opacity="0"/>
      <stop offset="100%" stop-color="black" stop-opacity="0.3"/>
    </radialGradient>
  </defs>

  <!-- Cucumber Body (3D Cylinder look) -->
  <rect x="5" y="15" width="210" height="50" rx="25" fill="url(#bodyGrad)" stroke="#123E16" stroke-width="1"/>
  
  <!-- Volumetric highlight -->
  <rect x="30" y="18" width="160" height="12" rx="6" fill="url(#shineGrad)"/>

  <!-- Skin Bumps (Detailed shading) -->
  <g opacity="0.7">
    <circle cx="25" cy="35" r="2" fill="#81C784" filter="blur(0.5px)"/>
    <circle cx="50" cy="50" r="1.5" fill="#81C784" filter="blur(0.5px)"/>
    <circle cx="75" cy="28" r="1.8" fill="#81C784" filter="blur(0.5px)"/>
    <circle cx="100" cy="45" r="2.2" fill="#81C784" filter="blur(0.5px)"/>
    <circle cx="130" cy="32" r="1.6" fill="#81C784" filter="blur(0.5px)"/>
    <circle cx="160" cy="52" r="2.5" fill="#81C784" filter="blur(0.5px)"/>
    <circle cx="190" cy="38" r="1.2" fill="#81C784" filter="blur(0.5px)"/>
    
    <circle cx="40" cy="22" r="1" fill="#A5D6A7" opacity="0.5"/>
    <circle cx="85" cy="58" r="1.2" fill="#A5D6A7" opacity="0.5"/>
    <circle cx="145" cy="25" r="1" fill="#A5D6A7" opacity="0.5"/>
  </g>

  <!-- End caps shadow for roundness -->
  <path d="M5 40C5 26.1929 16.1929 15 30 15V65C16.1929 65 5 53.8071 5 40Z" fill="black" fill-opacity="0.2"/>
  <path d="M215 40C215 26.1929 203.807 15 190 15V65C203.807 65 215 53.8071 215 40Z" fill="black" fill-opacity="0.1" transform="rotate(180, 215, 40)"/>
</svg>