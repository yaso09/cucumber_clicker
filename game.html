<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Salatalık Doğra</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Audio -->
  <audio id="bgm" src="./assets/sounds/background.mp3" loop></audio>
  <audio id="clickSound" src="./assets/sounds/click.mp3"></audio>

  <!-- Header Stats -->
  <header>
    <div class="resource">
      <span>🥒</span>
      <span id="count">0</span>
    </div>
    <div class="resource">
      <span>🥫</span>
      <span id="pickles">0</span>
    </div>
    <div class="resource">
      <span>💰</span>
      <span id="money">0</span>
    </div>
  </header>

  <!-- Main Game Area -->
  <main>
    <div id="workstation">
      <div id="board-container">
        <div id="board">
          <div id="cucumber-holder">
            <img id="cucumber" src="./assets/images/cucumber.svg">
          </div>
        </div>
      </div>
      <img id="knife" src="./assets/images/knife.svg">
      <div id="pickling-zone"></div>
      <div id="notifications"></div>
    </div>
  </main>

  <!-- Navigation -->
  <nav>
    <button data-modal="market"><span>🛒</span> <span>Market</span></button>
    <button data-modal="factories"><span>🏭</span> <span>Fabrikalar</span></button>
    <button data-modal="aunts"><span>👵</span> <span>Teyzeler</span></button>
    <button data-modal="pickle"><span>🥫</span> <span>Turşular</span></button>
    <button data-modal="bazaar"><span>⚖️</span> <span>Pazar</span></button>
  </nav>

  <!-- MODALS -->

  <!-- Market Modal -->
  <div id="market" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Market</span>
        <button class="btn-close" onclick="">×</button>
      </div>
      <div class="modal-body">
        <div class="card">
          <div class="card-header">
            <span>Mini Fabrika</span>
            <span>100 💰</span>
          </div>
          <button class="btn-primary" data-action="buyFactory">Satın Al</button>
        </div>
        <div class="card">
          <div class="card-header">
            <span>Turşucu Teyze</span>
            <span>150 💰</span>
          </div>
          <button class="btn-primary" data-action="buyAunt">Satın Al</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Factories Modal -->
  <div id="factories" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Fabrikalarım</span>
        <button class="btn-close">×</button>
      </div>
      <div class="modal-body" id="factoryList">
        <!-- Populated by JS -->
        <p style="text-align:center; opacity:0.6;">Henüz fabrikan yok.</p>
      </div>
    </div>
  </div>

  <!-- Aunts Modal -->
  <div id="aunts" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Teyzelerim</span>
        <button class="btn-close">×</button>
      </div>
      <div class="modal-body" id="auntList">
        <!-- Populated by JS -->
        <p style="text-align:center; opacity:0.6;">Henüz teyzen yok.</p>
      </div>
    </div>
  </div>

  <!-- Pickles Modal -->
  <div id="pickle" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Turşular</span>
        <button class="btn-close">×</button>
      </div>
      <div class="modal-body">
        <div class="card">
          <div class="card-header">
            <span>Turşu Kur (10 🥒)</span>
            <span>5 sn</span>
          </div>
          <button class="btn-primary" data-action="startPickle">Kur</button>
        </div>
        <div id="pickleList">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Bazaar Modal -->
  <div id="bazaar" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Pazar Yeri</span>
        <button class="btn-close">×</button>
      </div>
      <div class="modal-body">
        <div class="card">
          <div class="card-header">Salatalık Satışı</div>
          <p style="font-size:0.9em; opacity:0.8;">10 🥒 = 2 💰</p>
          <div class="card-actions">
            <button class="btn-primary" id="btn-sell-10">10 Tane Sat</button>
            <button class="btn-primary" data-action="sellAllCucumbers">Hepsini Sat</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header">Turşu Satışı</div>
          <p style="font-size:0.9em; opacity:0.8;">1 🥫 = 3 💰</p>
          <div class="card-actions">
            <button class="btn-primary" id="btn-sell-1pick">1 Tane Sat</button>
            <button class="btn-primary" data-action="sellAllPickles">Bütün Turşuları Sat</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- APK Modal -->
  <div id="apkModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Uygulamayı İndir</span>
        <button class="btn-close">×</button>
      </div>
      <div class="modal-body">
        <p>Bu oyunu Android cihazına yüklemek ister misin?</p>
        <div class="card-actions">
          <button class="btn-primary" onclick="window.location.href='./latest.apk'">APK İndir</button>
          <!-- Close provided by Header close button -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/game.js" type="module"></script>
</body>

</html>
